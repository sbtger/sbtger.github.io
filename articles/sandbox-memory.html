  body { margin: 0; background: var(--background); color: var(--text); }
  .wrap { width: min(100%, 1300px); margin: 0 auto; padding-inline: clamp(16px, 4vw, 52px); }
  header { position: sticky; z-index: 2; top: 0; background: var(--background); border-bottom: 1px solid var(--line); }

  h1 { font-size: 18px; line-height: 1.35; white-space: nowrap; }
  h2 { font-size: clamp(27px, 4vw, 43px); line-height: 1.18; letter-spacing: -.035em; }
  h3 { font-size: 19px; line-height: 1.4; }
  h4 { font-size: 15px; line-height: 1.4; }
  a { color: var(--mint); text-underline-offset: 4px; }
  button { font: inherit; }
  :is(button, a, .restore-scroll):focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
  nav { display: flex; gap: 5px; overflow-x: auto; padding: 3px; }
  nav a, .phase-button {
    padding: 5px 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
    font-size: 13px;
  }
  nav a:hover, .phase-button:hover { border-color: var(--line); }
  nav a[aria-current], .phase-button[aria-pressed="true"] {
    color: var(--mint); border-color: #42638c; background: var(--active);
  }
  main { padding-block: 25px 64px; }
  .intro p { margin-top: 7px; color: var(--muted); }
  .restore-diagram { margin: 17px 0; padding: clamp(12px, 2vw, 22px); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .restore-diagram .scenario { margin: 6px 0 10px; color: var(--muted); font-size: 13px; }
  .restore-scroll { overflow-x: auto; }
  .restore-grid { table-layout: fixed; min-width: 815px; border-collapse: separate; border-spacing: 7px 6px; }
  .restore-lifecycle { min-width: 960px; }
  .restore-lifecycle .stage-path > b { color: var(--mint); }
  .project-graph { position: relative; min-width: 940px; height: 365px; }
  .project-graph .graph-column { position: absolute; top: 0; width: 20%; text-align: center; }
  .project-graph .graph-node { position: absolute; top: var(--y); width: 20%; transform: translateY(-50%); text-align: center; padding: 7px 5px; background: var(--node); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; line-height: 1.3; }
  .project-graph .project { left: 0; }
  .project-graph .runtime { left: 27%; }
  .project-graph .vmm { left: 54%; }
  .project-graph .mode { left: 80%; }
  .project-graph .graph-node small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .project-links { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--mint); }
  .project-links .edge-label { fill: currentColor; stroke: var(--surface); stroke-width: 4px; paint-order: stroke fill; font-size: 10px; }
  .project-links path { fill: none; stroke: currentColor; stroke-width: 1.25; vector-effect: non-scaling-stroke; }
  .implementation-cases { display: grid; gap: 8px; margin-top: 10px; }
  .implementation-cases > div { border-top: 1px solid var(--line); padding-top: 7px; }
  .implementation-cases dt { color: var(--mint); }
  .comparison-graph { min-width: 700px; margin-top: 10px; }
  .comparison-graph :is(.graph-column,.graph-node) { width: var(--graph-node-width, 26%); }
  .comparison-graph.four-columns { min-width: 940px; }
  .restore-grid col.stage-label { width: 106px; }
  .restore-grid :is(th, td) { border: 0; padding: 0; }
  .restore-grid thead th { text-align: center; font-size: 15px; }
  .restore-grid .method-name { padding: 7px 3px; border-radius: 6px; border: 1px solid var(--line); background: var(--active); color: var(--mint); }
  .restore-grid .stage-name { min-width: 0; width: auto; text-align: center; vertical-align: middle; color: var(--amber); }
  .restore-grid .stage-path { border: 1px solid var(--line); border-radius: 7px; background: var(--node); padding: 6px 8px; vertical-align: middle; }
  .restore-steps { display: grid; gap: 7px; list-style: none; margin: 0; padding: 0; }
  .restore-steps li { position: relative; overflow-wrap: anywhere; }
  .restore-steps li:not(:last-child)::after {
    content: "↓";
    position: absolute;
    top: 100%;
    left: 2.2em;
    color: var(--mint);
    font-size: 10px;
    line-height: 7px;
  }
  .restore-steps b { margin-right: 6px; color: var(--mint); font-size: 12px; }
  .restore-steps .handler { color: var(--amber); }
  .restore-note-label { color: var(--mint); }
  .restore-note { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .restore-scroll-note { display: none; }
  .comparisons { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 17px; }
  .comparison, .tech { padding: clamp(12px, 2vw, 22px); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .phases { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 9px; }
  .phase-button { background: transparent; cursor: pointer; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }
  th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  thead th { font-weight: 650; color: var(--mint); }
  tbody th { width: 20%; min-width: 124px; font-weight: 650; }
  tbody tr:last-child :is(th,td) { border-bottom: 0; }
  tr > [data-phase].emphasized { background: var(--active); }
  .comparison[data-filtered] td { width: 78%; }
  .takeaway { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .details-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 21px 0 9px; }
  .details-head a { font-size: 13px; }
  .tech { margin-bottom: 11px; }
  .tech:target { border-color: #42638c; }
  .tech .goal { color: var(--muted); margin: 5px 0 12px; }
  .flowchart {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 19px;
  }
  .step {
    min-width: 0;
    position: relative;
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--node);
    overflow-wrap: anywhere;
  }
  .step small { display: block; color: var(--mint); font-size: 11px; }
  .step h4 { margin: 2px 0 4px; }
  .step p { font-size: 13px; color: var(--muted); line-height: 1.47; }
  .step:not(:last-child)::after {
    content: "→";
    position: absolute;
    width: 19px;
    top: calc(50% - .8em);
    right: -20px;
    color: var(--mint);
    text-align: center;
  }
  .facts { display: grid; grid-template-columns: minmax(0,1.23fr) minmax(0,1fr) minmax(0,1fr); gap: 13px; margin-top: 12px; }
  .facts > div { border-top: 1px solid var(--line); padding-top: 7px; min-width: 0; }
  dt { font-weight: 650; font-size: 13px; color: var(--amber); }
  dd { margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 895px) {
    .restore-scroll-note { margin-bottom: 3px; display: block; color: var(--muted); font-size: 12px; }
  }
  @media (max-width: 710px) {
    html { scroll-padding-top: 112px; }
    header .wrap { flex-direction: column; align-items: stretch; gap: 4px; padding-block: 9px; }
    nav { margin-inline: -3px; }
    .flowchart { grid-template-columns: 1fr; gap: 15px; }
    .step:not(:last-child)::after { content: "↓"; right: calc(50% - 10px); top: 100%; line-height: 16px; }
    .facts { grid-template-columns: 1fr; gap: 7px; }
    .comparison:not([data-filtered]) table { min-width: 630px; }
  }
  @page { margin: 12mm; }
  @media print {
    :root { color-scheme: light; --background: #fff; --surface: #fff; --node: #f1f1f1; --text: #202020; --muted: #414141; --line: #c8c8c8; --mint: #242424; --amber: #444444; }
    header { position: static; }
    nav, .phases, .details-head a { display: none !important; }
    .wrap { width: 100%; padding-inline: 0; }
    .line[hidden] { display: block !important; }
    .line + .line { break-before: page; }
    .comparison :is(td,th)[hidden] { display: table-cell !important; }
    .comparison[data-filtered] td { width: auto; }
    .comparison table { min-width: 0 !important; }
    .tech, .comparison, .restore-grid tr { break-inside: avoid; }
    .restore-grid { min-width: 0; }
    .restore-grid col.stage-label { width: 80px; }
    .restore-grid .method-name { background: var(--node); }
    .restore-scroll { overflow: visible; }
    .restore-scroll-note { display: none; }
    .flowchart { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 19px; }
    .step:not(:last-child)::after { content: "→"; top: calc(50% - .8em); right: -20px; }
    .facts { grid-template-columns: repeat(3,minmax(0,1fr)); }
  }
</style>

<template id="restore-comparison-diagram">

    <div class="restore-scroll" role="region" aria-label="三种快照恢复方式的阶段流程图" tabindex="0">
      <table class="restore-grid restore-lifecycle" aria-labelledby="restore-flow-title">
        <colgroup><col class="stage-label"><col><col><col><col><col></colgroup>
        <thead>
          <tr>
            <th scope="col">恢复方式</th>
            <th class="method-name" scope="col">准备内存后备</th>
            <th class="method-name" scope="col">恢复状态并注册内存槽</th>
            <th class="method-name" scope="col">运行时读页</th>
            <th class="method-name" scope="col">运行时写页</th>
            <th class="method-name" scope="col">访问时的页级映射</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th class="stage-name" scope="row">全量复制</th>
            <td class="stage-path">
              <ol class="restore-steps">
                <li><b>VMM</b><span>建立 VM 独立的 RAM 映射，并填入快照数据。</span></li>
              </ol>
            </td>
            <td class="stage-path shared-stage" rowspan="3"><b>VMM</b> 恢复 vCPU 和设备状态，向 KVM 注册内存槽，关联 guest 物理地址与 VMM 虚拟地址，随后启动 vCPU。</td>
            <td class="stage-path" colspan="2"><b>guest</b> 直接读写已经填好的私有 RAM 页。</td>
            <td class="stage-path shared-stage" rowspan="3"><b>宿主 KVM</b> 访问触发映射缺失或写保护时，按需建立或更新到宿主物理页的映射，guest 随后继续访问。</td>
          </tr>
          <tr>
            <th class="stage-name" scope="row">文件 CoW</th>
            <td class="stage-path">
              <ol class="restore-steps">
                <li><b>VMM</b><span>用 mmap(MAP_PRIVATE) 将快照文件映射为 RAM 后备。</span></li>
              </ol>
            </td>
            <td class="stage-path">
              <ol class="restore-steps">
                <li><b>宿主内核</b><span>读未修改的页时，从文件页缓存供页，未命中则读快照。同机 VM 映射同一文件偏移时可共享。</span></li>
              </ol>
            </td>
            <td class="stage-path">
              <ol class="restore-steps">
                <li><b>宿主内核</b><span>首次写文件后备页时，取得原页并复制成该 VM 的私有页。</span></li>
                <li><b>guest</b><span>写入私有页，其他 VM 仍可读原页。</span></li>
              </ol>
            </td>
          </tr>
          <tr>
            <th class="stage-name" scope="row">UFFD 按需供页</th>
            <td class="stage-path">
              <ol class="restore-steps">
                <li><b>VMM</b><span>建立待填充的 RAM 映射，注册 UFFD MISSING。</span></li>
              </ol>
            </td>
            <td class="stage-path" colspan="2">
              <ol class="restore-steps">
                <li><b>页尚未填充</b><span>读或写都会触发缺页。用户态缺页处理程序从快照取原页，用 UFFDIO_COPY 填进目标 RAM。</span></li>
                <li><b>页已填充</b><span>guest 直接读写目标页。</span></li>
                <li><b>加载策略</b><span>可只填访问到的页，也可在 VM 运行后由后台线程补齐剩余页。</span></li>
              </ol>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="restore-note"><strong class="restore-note-label">内核版本要求</strong> 宿主侧全量复制、文件 CoW 和匿名内存 UFFD 按需恢复的基础能力在 Linux 4.18 已具备。UFFD 按需恢复要求宿主允许 VMM 接收 guest 访问内存时触发的 KVM 缺页通知。具体 VMM 的最低版本另计。</p>

    <p class="restore-note"><strong class="restore-note-label">快照存储位置</strong> OpenSandbox Fast Sandbox 先把内存快照准备成节点本地文件，再按需映射。CubeSandbox 用 XFS 时直接映射本地快照文件，用 JuiceFS 时直接映射共享文件，缓存未命中才从远端取。E2B 则由用户态缺页处理程序按索引从缓存或存储取数据，再填入 VM。</p>
    <p class="restore-note"><strong class="restore-note-label">快照页加载策略</strong> cube-hypervisor 的 prefault 请求在运行前预填映射。文件 CoW 路径里，Linux 可能顺带预读邻近页。E2B 可预取预测会用到的热页。开启后台补齐的 UFFD 路径会在 guest 运行后继续加载剩余页。</p>

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function link(text, href) {
  const node = element("a", text);
  node.href = href;
  return node;
}

function renderComparison(model) {
  const section = element("section", "", "restore-diagram");
  const scroller = element("div", "", "restore-scroll");
  scroller.tabIndex = 0;
  scroller.setAttribute("role", "region");
  scroller.setAttribute("aria-label", model.name);
  const table = element("table", "", "restore-grid");
  table.setAttribute("aria-label", model.name);
  const columns = table.appendChild(element("colgroup"));
  columns.append(element("col", "", "stage-label"));
  const head = table.createTHead().insertRow();
  for (const name of ["技术", ...model.phases]) {
    const label = element("th", name, "method-name");
    label.scope = "col";
    head.append(label);
  }
  const body = table.createTBody();
  for (const id of model.ids) {
    const technique = techniques[id];
    const row = body.insertRow();
    const label = element("th", technique.name, "stage-name");
    label.scope = "row";
    row.append(label);
    const values = model.compareTradeoffs ? [technique.scenario, technique.benefit, technique.cost] : technique.stages;
    for (const text of values) {
      const cell = element("td", "", "stage-path");
      if (model.highlightActors) {
        for (const part of text.split(/\b(Host|Guest|VMM)\b/)) {
          cell.append(/^(Host|Guest|VMM)$/.test(part)
            ? element("strong", part, "restore-note-label")
            : part);
        }
      } else {
        cell.textContent = text;
      }
      row.append(cell);
    }
  }
  scroller.append(table);
  section.append(element("h3", model.name), scroller);
  if (model.takeaway) section.append(element("p", model.takeaway, "restore-note"));
  if (model.kernelNote) {
    const note = element("p", "", "restore-note");
    note.append(element("strong", "内核版本要求", "restore-note-label"), " " + model.kernelNote);
    section.append(note);
  }
  return section;
}

function renderImplementationMap(chapterId) {
  const model = implementationMaps[chapterId];
  const section = element("section", "", "restore-diagram");
  const heading = element("h3", model.columns[0].some(node => node[0] === "dsec") ? "开源方案与公开案例" : "开源方案");
  heading.id = chapterId + "-implementations";
  section.setAttribute("aria-labelledby", heading.id);
  const scroller = element("div", "", "restore-scroll");
  scroller.tabIndex = 0;
  scroller.setAttribute("role", "region");
  scroller.setAttribute("aria-labelledby", heading.id);
  const graph = element("div", "", "project-graph comparison-graph");
  const step = 55;
  const height = 86 + (Math.max(...model.columns.map(column => column.length)) - 1) * step;
  graph.style.height = height + "px";
  const svgNamespace = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNamespace, "svg");
  svg.setAttribute("class", "project-links");
  svg.setAttribute("viewBox", "0 0 1000 " + height);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  graph.append(svg);

  const positions = new Map();
  const fourColumns = model.columns.length === 4;
  const fiveColumns = model.columns.length === 5;
  const xPositions = fiveColumns ? [0, 210, 420, 630, 840] : fourColumns ? [0, 270, 540, 800] : [0, 370, 740];
  const nodeWidth = fiveColumns ? 160 : fourColumns ? 200 : 260;
  graph.classList.toggle("four-columns", fourColumns || fiveColumns);
  graph.style.setProperty("--graph-node-width", nodeWidth / 10 + "%");
  for (const [columnIndex, column] of model.columns.entries()) {
    const x = xPositions[columnIndex];
    const label = element("h4", model.labels[columnIndex], "graph-column");
    label.style.left = x / 10 + "%";
    graph.append(label);
    for (const [index, [id, name, subtitle]] of column.entries()) {
      if (id === null) continue;
      const y = (height - (column.length - 1) * step) / 2 + 10 + index * step;
      const node = element("div", name, "graph-node");
      node.style.left = x / 10 + "%";
      node.style.setProperty("--y", y + "px");
      if (subtitle) node.append(element("small", subtitle));
      graph.append(node);
      positions.set(id, { x, y });
    }
  }
  for (const [source, target, annotation] of model.edges) {
    const start = positions.get(source);
    const end = positions.get(target);
    const direction = start.x < end.x ? 1 : -1;
    const x = direction === 1 ? start.x + nodeWidth : start.x;
    const tip = direction === 1 ? end.x - 1 : end.x + nodeWidth + 1;
    const arrowBase = tip - 7 * direction;
    const middle = (x + tip) / 2;
    const line = document.createElementNS(svgNamespace, "path");
    line.setAttribute("d", ["M", x, start.y, "C", middle, start.y, middle, end.y, tip, end.y].join(" "));
    const arrow = document.createElementNS(svgNamespace, "polygon");
    arrow.setAttribute("points", tip + "," + end.y + " " + arrowBase + "," + (end.y - 4) + " " + arrowBase + "," + (end.y + 4));
    arrow.setAttribute("fill", "currentColor");
    svg.append(line, arrow);
    if (annotation) {
      const label = document.createElementNS(svgNamespace, "text");
      label.setAttribute("class", "edge-label");
      label.setAttribute("x", middle);
      label.setAttribute("y", (start.y + end.y) / 2 - 5);
      label.setAttribute("text-anchor", "middle");
      label.textContent = annotation;
      svg.append(label);
    }
  }

  const references = element("p", "", "sources");
  for (const id of model.refs) references.append(link(...sources[id]));
  scroller.append(graph);
  section.append(heading, scroller);
  if (model.note) section.append(element("p", model.note, "restore-note"));
  for (const notes of model.notes ?? []) {
    const paragraph = element("p", "", "restore-note");
    for (const [name, description] of notes) {
      if (paragraph.hasChildNodes()) paragraph.append("　");
      paragraph.append(element("strong", name, "restore-note-label"), " " + description);
    }
    section.append(paragraph);
  }
  if (model.extra) {
    const [name, description] = model.extra;
    const paragraph = element("p", "", "restore-note");
    paragraph.append(element("strong", name, "restore-note-label"), " " + description);
    section.append(paragraph);
  }
  if (model.examples) {
    const cases = element("dl", "", "implementation-cases");
    for (const [name, description] of model.examples) {
      const item = element("div");
      item.append(element("dt", name), element("dd", description));
      cases.append(item);
    }
    section.append(cases);
  }
  section.append(references);
  return section;
}

function renderMeasuredEffects(chapterId) {
  const section = element("section", "", "restore-diagram");
  const heading = element("h3", "实际效果");
  heading.id = chapterId + "-effects";
  section.setAttribute("aria-labelledby", heading.id);
  section.append(heading);
  const results = element("dl", "", "implementation-cases");
  for (const [label, description, refs = []] of measuredEffects[chapterId]) {
    const item = element("div");
    item.append(element("dt", label), element("dd", description));
    if (refs.length) {
      const sources = element("dd", "", "sources");
      for (const reference of refs) sources.append(link(...reference));
      item.append(sources);
    }
    results.append(item);
  }
  section.append(results);
  return section;
}

const primaryNav = document.getElementById("nav");
const main = document.getElementById("main");
const targets = new Map();
const pages = chapters.map(chapter => {
  const line = element("section", "", "line");
  line.id = chapter.id;
  const header = element("div", "", "intro");
  const heading = element("h2", chapter.name);
  heading.id = chapter.id + "-title";
  line.setAttribute("aria-labelledby", heading.id);
  header.append(heading, element("p", chapter.summary));

  line.append(header);
  if (chapter.id === "restore") {
    line.append(document.getElementById("restore-comparison-diagram").content.cloneNode(true));
  } else {
    for (const group of chapter.comparisons) line.append(renderComparison(group));
    line.append(renderImplementationMap(chapter.id));
  }

  line.append(renderMeasuredEffects(chapter.id));

  const navLink = link(chapter.short, "#" + chapter.id);
  primaryNav.append(navLink);
  main.append(line);
  const page = { line, navLink };
  targets.set(chapter.id, page);
  return page;
});

function navigate() {
  const target = location.hash.slice(1);
  const active = targets.get(target) || pages[0];
  for (const page of pages) {
    page.line.hidden = page !== active;
    if (page === active) page.navLink.setAttribute("aria-current", "location");
    else page.navLink.removeAttribute("aria-current");
  }
  if (targets.has(target) && target !== active.line.id) {
    document.getElementById(target).scrollIntoView({block:"start"});
  } else {
    window.scrollTo(0, 0);
  }
}
window.addEventListener("hashchange", navigate);
navigate();
